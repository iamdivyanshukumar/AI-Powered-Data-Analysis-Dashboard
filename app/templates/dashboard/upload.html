{% extends "base.html" %}

{% block title %}Upload Data{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 65vh;">
    <div class="col-md-8 col-lg-6">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Analyze New Dataset</h2>
            <p class="text-muted">Upload a CSV file to generate instant insights.</p>
        </div>

        <div class="card shadow-lg border-0">
            <div class="card-body p-4 p-md-5">
                <form method="POST" enctype="multipart/form-data" action="{{ url_for('dashboard.upload') }}" id="uploadForm">
                    
                    <div class="upload-area position-relative border-2 border-dashed rounded-4 p-5 text-center mb-4" style="background-color: #f8fafc; border-color: #cbd5e1; transition: all 0.3s;">
                        <div class="mb-3 text-primary opacity-75">
                            <i class="bi bi-cloud-arrow-up display-3"></i>
                        </div>
                        <h5 class="fw-bold mb-2">Click to select a file</h5>
                        <p class="text-muted small mb-0">Supported format: .CSV (Max 16MB)</p>
                        
                        <input class="form-control position-absolute top-0 start-0 w-100 h-100 opacity-0" 
                               type="file" id="file" name="file" accept=".csv" required 
                               style="cursor: pointer;" onchange="updateFileName(this)">
                    </div>
                    
                    <div id="fileInfo" class="alert alert-primary d-flex align-items-center d-none mb-4">
                        <i class="bi bi-file-earmark-spreadsheet-fill fs-4 me-3"></i>
                        <span id="fileName" class="fw-medium text-truncate"></span>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg py-3 shadow-sm position-relative" id="submitBtn">
                            <span class="btn-text"><i class="bi bi-stars me-2"></i>Upload & Analyze</span>
                            <span class="spinner-border spinner-border-sm position-absolute top-50 start-50 translate-middle d-none" role="status"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="text-center mt-4 d-flex justify-content-center gap-4 text-muted small">
            <span><i class="bi bi-shield-lock-fill me-1"></i> Secure Processing</span>
            <span><i class="bi bi-lightning-charge-fill me-1"></i> AI Powered</span>
        </div>
    </div>
</div>

{% block scripts %}
<script>
function updateFileName(input) {
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const uploadArea = document.querySelector('.upload-area');
    
    if (input.files && input.files[0]) {
        fileName.textContent = input.files[0].name;
        fileInfo.classList.remove('d-none');
        uploadArea.style.borderColor = 'var(--primary-color)';
        uploadArea.style.backgroundColor = 'var(--primary-light)';
    }
}

document.getElementById('uploadForm').addEventListener('submit', function() {
    const btn = document.getElementById('submitBtn');
    const text = btn.querySelector('.btn-text');
    const spinner = btn.querySelector('.spinner-border');
    
    btn.disabled = true;
    text.classList.add('opacity-0');
    spinner.classList.remove('d-none');
});
</script>
{% endblock %}
{% endblock %}
