{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4">
            <div class="bg-white p-3 rounded-circle d-inline-block shadow-sm mb-3">
                <i class="bi bi-person-circle fs-1 text-primary"></i>
            </div>
            <h3 class="fw-bold">Welcome Back</h3>
        </div>
        
        <div class="card shadow-lg border-0">
            <div class="card-body p-4 p-sm-5">
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-4">
                        <label for="username" class="form-label text-muted small fw-bold uppercase">Username</label>
                        <input type="text" class="form-control form-control-lg bg-light border-0" id="username" name="username" required placeholder="Enter your username">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label text-muted small fw-bold uppercase">Password</label>
                        <input type="password" class="form-control form-control-lg bg-light border-0" id="password" name="password" required placeholder="••••••••">
                    </div>
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label small text-muted" for="remember">Remember me</label>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-3 border-0">
                <p class="mb-0 small">New to AutoVizAI? <a href="{{ url_for('auth.signup') }}" class="text-primary fw-bold text-decoration-none">Create Account</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
